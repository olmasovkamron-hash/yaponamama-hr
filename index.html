<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- в адресе приложения сотрудника — личный токен; не передаём его другим сайтам -->
<meta name="referrer" content="no-referrer">
<title>Yaponamama — работа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js"></script>
<!-- Inter — ближайший к Apple SF Pro бесплатный шрифт: на Android и компьютерах вид как на iPhone
     (на iPhone/Mac используется сам SF Pro — он первый в списке) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Чистый монохромный стиль: светло-серый фон, белые карточки с тонкой рамкой, контурные значки,
     чёрные «таблетки» для главных кнопок, красный — только для важного (просрочено, бренд) */
  :root {
    --page: #f4f4f5;
    --bg: #ffffff;
    --text: #111111;
    --hint: #7a7a80;
    --card: var(--bg);
    --line: #e7e7ea;                 /* рамки карточек */
    --sep: #ececee;                  /* линии между строками */
    --soft: #f1f1f3;                 /* круг под значком, чипы */
    --accent: #111111;               /* главные кнопки — чёрные */
    --accent-text: #ffffff;
    --brand: #e2231a;                /* красный Yaponamama */
    --brand-soft: #fdecec;
    --link: #111111;
    --danger: #e2231a;
    --ok: #1f9d55;
    --radius: 20px;
  }
  :root[data-theme="dark"] {
    --page: #0b0b0c; --bg: #18181b; --text: #f4f4f5; --hint: #9a9aa2; --line: #2a2a2f; --sep: #26262b;
    --soft: #26262b; --accent: #f4f4f5; --accent-text: #111111; --brand-soft: #3a1513; --link: #f4f4f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv11", "ss01";   /* у Inter — формы букв ближе к SF */
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
  button:active { opacity: .6; }
  #app { max-width: 640px; margin: 0 auto; padding: 12px 16px 112px; }
  h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; margin: 12px 2px 14px; }
  h2 { font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: .02em;
       color: var(--hint); margin: 26px 16px 8px; }
  .sub { color: var(--hint); margin: 0 4px 20px; font-size: 15px; }

  .hero {
    border-radius: var(--radius); overflow: hidden; position: relative; margin-bottom: 16px;
    background: var(--bg); aspect-ratio: 16 / 9;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }

  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; }

  /* шапка: название слева, профиль справа */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px;
         margin: -12px -16px 0; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top .brand { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .top .me { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .top .ava { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--soft);
              display: grid; place-items: center; color: var(--hint); }
  .top .me b { display: block; font-weight: 600; font-size: 16px; line-height: 1.2; }
  .top .me small { display: block; color: var(--hint); font-size: 14px; }
  .hello { margin: 26px 2px 2px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
  .hello + .sub { margin-top: 4px; }

  /* карточки-цифры в два столбца */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line);
          border-radius: 18px; padding: 16px 14px; text-align: left; min-width: 0; }
  .stat .ci { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--soft);
              display: grid; place-items: center; }
  .stat.alert .ci { background: var(--brand-soft); color: var(--brand); }
  .stat .k { display: block; color: var(--hint); font-size: 14px; line-height: 1.2; }
  .stat .v { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.alert .v { color: var(--brand); }
  .stat .d { display: block; color: var(--hint); font-size: 13px; margin-top: 1px; }
  .stat .d:empty { display: none; }

  /* карточка-группа со строками */
  .menu { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 4px 16px; margin-bottom: 14px; }
  .menu .mh { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; font-size: 19px; font-weight: 700;
              letter-spacing: -0.02em; }
  .mi {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px;
    padding: 12px 0; border: 0; background: none; text-align: left;
  }
  .mi + .mi { border-top: 1px solid var(--sep); }
  .mi .ic { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--soft);
            display: grid; place-items: center; }
  .mi .tx { flex: 1; min-width: 0; }
  .mi .tt { display: block; font-weight: 500; }
  .mi .st { display: block; color: var(--hint); font-size: 14px; margin-top: 1px; }
  .mi .tag, .tag { flex: none; font-size: 14px; padding: 4px 10px; border-radius: 999px;
                   background: var(--brand-soft); color: var(--brand); }
  .tag.gray { background: var(--soft); color: var(--hint); }
  .mi .chev { color: var(--hint); opacity: .7; width: 18px; height: 18px; }
  .mi.off { opacity: .5; }

  /* нижняя панель вкладок */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg);
          border-top: 1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .tabs[hidden] { display: none; }
  .tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 620px; margin: 0 auto; }
  .tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none;
                 padding: 8px 4px; border-radius: 16px; color: var(--hint); font-size: 13px; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }

  .list { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 56px; background: none; border: 0; padding: 14px 0; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--sep); }
  .row::after { content: ""; flex: none; width: 7px; height: 7px; margin-right: 4px; border-top: 1.8px solid var(--hint);
                border-right: 1.8px solid var(--hint); transform: rotate(45deg); opacity: .7; }

  .rich { white-space: pre-line; background: var(--card); border-radius: var(--radius); padding: 16px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .card .name { font-weight: 600; font-size: 17px; margin-bottom: 6px; }
  .card .line { margin: 4px 0; }
  .card a { color: var(--link); text-decoration: none; }
  .gallery img { width: 100%; border-radius: var(--radius); display: block; margin-bottom: 10px; }

  .note { background: var(--card); border-radius: 12px; padding: 12px 14px; color: var(--hint); font-size: 14px; }
  .field { margin-bottom: 18px; }
  .field[hidden] { display: none; }
  .label { display: block; font-weight: 600; margin-bottom: 8px; }
  .label .opt { font-weight: 400; color: var(--hint); font-size: 13px; }
  .hint { color: var(--hint); font-size: 13px; margin-top: 6px; }
  input, textarea {
    width: 100%; min-height: 50px; padding: 13px 16px; border-radius: 12px; border: 1.5px solid transparent;
    background: var(--bg); color: var(--text); font: inherit; outline: none; appearance: none;
  }
  input::placeholder, textarea::placeholder { color: var(--hint); opacity: .7; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 999px; background: var(--card);
    border: 1.5px solid transparent; font-size: 15px;
  }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .err { display: none; color: var(--danger); font-size: 13px; margin-top: 6px; }
  .bad .err { display: block; }
  .bad input, .bad textarea, .bad .chip { border-color: var(--danger); }
  .consent { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
  .consent input { width: 22px; height: 22px; flex: none; margin: 1px 0 0; appearance: auto; accent-color: var(--accent); }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--page);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -0.5px 0 var(--sep);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    .bottom { background: color-mix(in srgb, var(--page) 80%, transparent);
              -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  }
  .bottom[hidden] { display: none; }
  .btn {
    display: block; width: 100%; max-width: 608px; min-height: 52px; margin: 0 auto; padding: 14px;
    border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-text);
    font-size: 17px; font-weight: 600;
  }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom));
    max-width: 608px; margin: 0 auto; background: var(--danger); color: #fff;
    padding: 12px 14px; border-radius: 12px; text-align: center; font-size: 14px;
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.ok { background: var(--ok); }

  /* приложение сотрудника */
  .tile.off { opacity: .5; }
  .tile .badge { font-size: 12px; opacity: .8; }
  /* карточка «кто я» — как профиль Apple ID: круг с инициалами, имя, должность */
  .who { display: flex; align-items: center; gap: 14px; background: var(--bg); border-radius: var(--radius);
         padding: 14px 16px; margin: 8px 0 20px; }
  .who .ava { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
              background: linear-gradient(180deg, #a5abb6, #858a94); color: #fff; font-size: 22px; font-weight: 600; }
  .who .name { font-weight: 600; font-size: 20px; letter-spacing: -0.02em; }
  .who .meta { color: var(--hint); font-size: 15px; }
  .greet { color: var(--hint); font-size: 15px; margin: 4px 4px 0; }
  .day { display: flex; justify-content: space-between; align-items: center; background: var(--card);
         border-radius: 12px; padding: 13px 16px; margin-bottom: 8px; }
  .day.today { outline: 2px solid var(--accent); }
  .day.past { opacity: .5; }
  .day .time { font-weight: 600; }
  .day .off { color: var(--hint); }
  .item { background: var(--card); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .item .top { display: flex; justify-content: space-between; gap: 12px; }
  .item .st { color: var(--hint); font-size: 14px; white-space: nowrap; }
  .item .sub { color: var(--hint); font-size: 13px; margin-top: 4px; white-space: pre-line; }
  .big-num { font-size: 32px; font-weight: 700; }
  .chip:disabled { opacity: .45; }
  .loading { color: var(--hint); text-align: center; padding: 40px 0; }
  .bar { height: 8px; border-radius: 4px; background: rgba(127, 127, 127, .2); overflow: hidden; margin: 10px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); }
  .stage { margin-bottom: 14px; }
  .stage.future { opacity: .5; }
  .stage h3 { font-size: 15px; margin: 18px 0 8px; display: flex; gap: 8px; align-items: center; }
  .stage h3 .now { font-size: 12px; font-weight: 600; color: var(--accent-text); background: var(--accent);
                   border-radius: 6px; padding: 2px 6px; }
  .check { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 0;
           background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 6px; }
  .check .mark { flex: none; width: 24px; text-align: center; font-size: 18px; line-height: 1.2; }
  .check .what { flex: 1; }
  .check .state { display: block; color: var(--hint); font-size: 12px; margin-top: 3px; }
  .check .confirm { flex: none; border: 0; border-radius: 8px; padding: 6px 10px; background: var(--accent);
                    color: var(--accent-text); font-size: 13px; font-weight: 600; }

  /* единый вид внутренних экранов: белые карточки с тонкой рамкой */
  .card, .item, .day, .check, .rich, .note, .who { border: 1px solid var(--line); }
  .card, .rich, .who { border-radius: var(--radius); }
  .item, .day, .check, .note { border-radius: 16px; }
  .day { min-height: 54px; }
  .day.today { outline: none; border: 1.5px solid var(--text); }
  input, textarea { border: 1px solid var(--line); }
  input:focus, textarea:focus { border-color: var(--text); }
  .chip { background: var(--bg); border: 1px solid var(--line); }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn { border-radius: 999px; }
  .bar > div { background: var(--brand); }
  .bottom { background: var(--bg); box-shadow: 0 -1px 0 var(--line); -webkit-backdrop-filter: none; backdrop-filter: none; }
  /* когда видна панель вкладок — место под неё */
  body.has-tabs #app { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="app"></div>
<div class="bottom" id="bottom" hidden><button class="btn" id="bottomBtn"></button></div>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
// вне Telegram скрипт тоже создаёт WebApp, но с platform = "unknown"
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform !== "unknown"
  ? window.Telegram.WebApp : null;
const D = window.APP_DATA;
const params = new URLSearchParams(location.search);
let lang = D.texts[params.get("lang")] ? params.get("lang") : "ru";

if (tg) {
  document.documentElement.setAttribute("data-tg", "");
  tg.ready();
  tg.expand();
}
// тёмная тема — как в Telegram (или как в системе, если открыто в браузере)
function applyTheme() {
  const dark = tg ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  try {
    if (tg) { tg.setHeaderColor(dark ? "#18181b" : "#ffffff"); tg.setBackgroundColor(dark ? "#0b0b0c" : "#f4f4f5"); }
  } catch (e) { /* старый клиент Telegram */ }
}
applyTheme();
if (tg) tg.onEvent("themeChanged", applyTheme);

const t = (k) => (D.texts[lang] && D.texts[lang][k]) || D.texts.ru[k] || k;
const app = document.getElementById("app");
const bottom = document.getElementById("bottom");
const bottomBtn = document.getElementById("bottomBtn");

// ---------- утилиты ----------

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}

function setBottom(label, onClick) {
  bottom.hidden = !label;
  bottomBtn.textContent = label || "";
  bottomBtn.onclick = onClick || null;
}

let toastTimer;
function toast(msg, ok = false) {
  const n = document.getElementById("toast");
  n.textContent = msg;
  n.classList.toggle("ok", ok);
  n.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => n.classList.remove("show"), 2600);
}

function haptic(type) {
  try { tg && tg.HapticFeedback.notificationOccurred(type); } catch (e) { /* старый клиент */ }
}

function openLink(url) {
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
}

// ---------- навигация ----------

const stack = [];
let current = null;

function go(screen) {
  if (current) stack.push(current);
  show(screen);
}

function back() {
  show(stack.pop() || (STAFF ? staffHome : home));
}

function show(screen) {
  current = screen;
  app.replaceChildren();
  setBottom(null);
  screen();
  renderTabs();
  window.scrollTo(0, 0);
  if (tg) stack.length ? tg.BackButton.show() : tg.BackButton.hide();
}

// ---------- вкладки внизу (приложение сотрудника) ----------
let TABS = null;   // [{ key, icon, label, screen }]
function renderTabs() {
  const nav = document.getElementById("tabs");
  const visible = !!TABS && stack.length === 0 && bottom.hidden;   // только на главных экранах вкладок
  nav.hidden = !visible;
  document.body.classList.toggle("has-tabs", visible);
  if (!visible) return;
  document.getElementById("tabsIn").replaceChildren(...TABS.map((tb) =>
    el("button", { class: current === tb.screen ? "on" : "", onclick: () => { stack.length = 0; show(tb.screen); } },
      icon(tb.icon), el("span", { text: tb.label() }))));
}

// контурные значки (стиль Lucide), 24×24
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',
  calendar: '<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  book: '<path d="M4 19V5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  swap: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  wallet: '<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M16 15h2"/>',
  megaphone: '<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="m21 16-5-5-9 9"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>',
};
function icon(name, cls = "i") {

// Повторяет STEPS из handlers/candidate.py (без фото и голосового — их бот спросит в чате).
// Окончательная проверка всё равно делается в боте.

const FIELDS = [
  { section: "app_sec_about" },
  { f: "gender", kind: "choice", group: "gender" },
  { f: "lang_ru", kind: "choice", group: "lang_level" },
  { f: "lang_uz", kind: "choice", group: "lang_level" },
  { f: "address", kind: "text", min: 5, max: 200, err: "err_address" },
  { f: "military", kind: "choice", group: "military", when: (d) => d.gender === "male" },
  { f: "student", kind: "choice", group: "yesno" },
  { f: "education", kind: "choice", group: "education" },
  { f: "specialty", kind: "text", min: 2, max: 100, optional: true, err: "err_specialty",
    when: (d) => d.education === "bachelor" },
  { f: "experience", kind: "choice", group: "experience" },
  { f: "last_job", kind: "area", min: 5, max: 300, optional: true, err: "err_last_job",
    hint: "app_hint_last_job", when: (d) => d.experience && d.experience !== "none" },
  { f: "other_vacancies", kind: "multi" },
  { section: "app_sec_personal" },
  { f: "full_name", kind: "text", min: 2, max: 100, err: "err_name" },
  { f: "birth_date", kind: "date", err: "err_date" },
  { f: "phone", kind: "tel", err: "err_phone", placeholder: "+998 90 123 45 67" },
  // паспорт и ПИНФЛ бот спрашивает только у принятых
];

const fieldNodes = {};

function normPhone(v) {
  let d = v.replace(/\D/g, "");
  if (d.length === 9) d = "998" + d;
  return d.length === 12 && d.startsWith("998") ? "+" + d : null;
}

function isoToDots(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? `${m[3]}.${m[2]}.${m[1]}` : null;
}

function chipGroup(spec) {
  const box = el("div", { class: "chips" });
  const items = spec.kind === "multi"
    ? D.vacancies.filter((v) => v.key !== S.vacancy).map((v) => [v.key, v.title[lang]])
    : Object.entries(D.options[spec.group]).map(([k, label]) => [k, label[lang]]);
  for (const [key, label] of items) {
    const isOn = () => spec.kind === "multi" ? S.form.other_vacancies.includes(key) : S.form[spec.f] === key;
    const chip = el("button", { class: "chip" + (isOn() ? " on" : ""), type: "button", text: label });
    chip.onclick = () => {
      if (spec.kind === "multi") {
        const list = S.form.other_vacancies;
        S.form.other_vacancies = list.includes(key) ? list.filter((x) => x !== key) : [...list, key];
      } else {
        S.form[spec.f] = key;
        box.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
      }
      chip.classList.toggle("on", isOn());
      fieldNodes[spec.f].classList.remove("bad");
      refreshVisibility();
    };
    box.append(chip);
  }
  return box;
}

function inputFor(spec) {
  const common = {
    oninput: (e) => { S.form[spec.f] = e.target.value; fieldNodes[spec.f].classList.remove("bad"); },
    placeholder: spec.placeholder || false,
  };
  if (spec.kind === "area") return el("textarea", { ...common, maxlength: spec.max }, S.form[spec.f] || "");
  if (spec.kind === "date") {
    const today = new Date().toISOString().slice(0, 10);
    return el("input", { ...common, type: "date", min: "1950-01-01", max: today, value: S.form[spec.f] || "" });
  }
  const type = spec.kind === "tel" ? "tel" : "text";
  const inputmode = spec.kind === "num" ? "numeric" : spec.kind === "tel" ? "tel" : false;
  const value = S.form[spec.f] || (spec.kind === "tel" ? "+998 " : "");
  if (spec.kind === "tel") S.form[spec.f] = value;
  return el("input", { ...common, type, inputmode, value, maxlength: spec.max || false,
                       autocapitalize: spec.f === "passport" ? "characters" : false });
}

function form() {
  app.append(
    el("h1", { text: vacancy(S.vacancy).title[lang] }),
    el("p", { class: "sub", text: `📍 ${branchName(S.branch)}` }),
  );
  for (const spec of FIELDS) {
    if (spec.section) { app.append(el("h2", { text: t(spec.section) })); continue; }
    const isChoice = spec.kind === "choice" || spec.kind === "multi";
    const node = el("div", { class: "field" },
      el("span", { class: "label" }, t(`app_q_${spec.f}`),
        spec.optional || spec.kind === "multi" ? el("span", { class: "opt", text: ` · ${t("app_optional")}` }) : null),
      isChoice ? chipGroup(spec) : inputFor(spec),
      spec.hint ? el("div", { class: "hint", text: t(spec.hint) }) : null,
      el("div", { class: "err" }),
    );
    fieldNodes[spec.f] = node;
    app.append(node);
  }
  const consentBox = el("input", { type: "checkbox", checked: S.consent,
                                    onchange: (e) => { S.consent = e.target.checked; consentField.classList.remove("bad"); } });
  const consentField = el("div", { class: "field" },
    el("label", { class: "consent" }, consentBox, el("span", { text: t("app_consent_check") })),
    el("div", { class: "err", text: t("app_need_consent") }));
  fieldNodes.consent = consentField;
  app.append(el("p", { class: "note", text: t("app_media_note") }), el("h2"), consentField);
  refreshVisibility();
  setBottom(t("app_submit"), submit);
}

function refreshVisibility() {
  for (const spec of FIELDS) {
    if (spec.when && fieldNodes[spec.f]) fieldNodes[spec.f].hidden = !spec.when(S.form);
  }
}

function validate(spec) {
  const raw = S.form[spec.f];
  if (spec.kind === "multi") return { ok: true, value: raw || [] };
  if (spec.kind === "choice") return raw in D.options[spec.group] ? { ok: true, value: raw } : { ok: false, err: "app_err_required" };
  const text = (raw || "").trim();
  const empty = !text || (spec.kind === "tel" && text === "+998");
  if (empty) return spec.optional ? { ok: true, value: null } : { ok: false, err: "app_err_required" };
  let value = null;
  if (spec.kind === "date") value = isoToDots(text);
  else if (spec.kind === "tel") value = normPhone(text);
  else if (spec.pattern) { const v = spec.normalize(text); value = spec.pattern.test(v) ? v : null; }
  else { const v = text.replace(/\s+/g, " "); value = v.length >= spec.min && v.length <= spec.max ? v : null; }
  return value ? { ok: true, value } : { ok: false, err: spec.err };
}

function submit() {
  const payload = { v: 1, lang, branch: S.branch, vacancy: S.vacancy, consent: S.consent };
  let firstBad = null;
  for (const spec of FIELDS) {
    if (spec.section) continue;
    const node = fieldNodes[spec.f];
    if (spec.when && !spec.when(S.form)) { payload[spec.f] = null; continue; }
    const r = validate(spec);
    node.classList.toggle("bad", !r.ok);
    if (r.ok) payload[spec.f] = r.value;
    else { node.querySelector(".err").textContent = t(r.err); firstBad = firstBad || node; }
  }
  if (!S.consent) { fieldNodes.consent.classList.add("bad"); firstBad = firstBad || fieldNodes.consent; }
  if (firstBad) {
    haptic("error");
    toast(S.consent || firstBad !== fieldNodes.consent ? t("app_fix_errors") : t("app_need_consent"));
    firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (!tg || !tg.sendData) { toast(t("app_not_in_tg")); return; }
  try {
    haptic("success");
    tg.sendData(JSON.stringify(payload));  // Telegram сам закроет приложение
  } catch (e) {
    toast(t("app_not_in_tg"));
  }
}

// Приложение сотрудника (?mode=staff&api=<адрес сервера>&t=<личный токен>)
// ======================================================================

const STAFF = params.get("mode") === "staff";
let API = (params.get("api") || "").replace(/\/$/, "");

/** Актуальный адрес сервера: бот публикует его в api.json при каждой смене туннеля.
 *  Адрес из кнопки (?api=) — запасной: кнопка могла устареть. */
async function resolveApi() {
  try {
    const r = await fetch(`api.json?ts=${Date.now()}`, { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j.api) API = j.api.replace(/\/$/, "");
    }
  } catch (e) { /* остаёмся на адресе из кнопки */ }
}
const TOKEN = params.get("t");
let ME = null;

async function api(path, body) {
  const headers = { "Content-Type": "application/json" };
  if (TOKEN) headers["X-Auth"] = "token " + TOKEN;
  else if (tg && tg.initData) headers["X-Auth"] = "tma " + tg.initData;
  let r;
  try {
    r = await fetch(API + path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw { code: "offline" };
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: data.error || "generic", status: r.status };
  return data;
}

function errText(e) {
  if (e.code === "offline") return t("sa_offline");
  if (e.status === 401 || e.status === 403) return t("sa_auth");
  for (const key of ["sa_err_" + e.code, e.code]) if (D.texts[lang][key]) return t(key);
  return t("sa_err_generic");
}

/** Экран с загрузкой: показывает «…», затем вызывает render(data) или текст ошибки. */
function loading(title, load, render) {
  app.append(el("h1", { text: plain(title) }));
  const box = el("div", { class: "loading", text: "…" });
  app.append(box);
  const screen = current;
  load().then((data) => {
    if (current !== screen) return;  // пользователь уже ушёл с экрана
    box.remove();
    render(data);
  }).catch((e) => { box.textContent = errText(e); });
}

  loading(t("sa_schedule"), () => api("/api/schedule"), ({ shifts }) => {
    if (!shifts.length) { app.append(el("p", { class: "sub", text: t("sa_no_shifts") })); return; }
    const now = todayIso();
    for (const s of shifts) {
      const cls = "day" + (s.date === now ? " today" : s.date < now ? " past" : "");
      app.append(el("div", { class: cls },
        el("span", { text: dayLabel(s.date) + (s.date === now ? ` · ${t("sa_today")}` : "") }),
        el("span", { class: s.day_off ? "off" : "time", text: shiftLabel(s) })));
    }
  });
}

function staffSwap() {
  const load = () => Promise.all([api("/api/schedule"), api("/api/colleagues"), api("/api/swaps")]);
  loading(t("sa_swap"), load, ([{ shifts }, { colleagues }, { swaps }]) => {
    const pick = { shift: null, colleague: null, theirs: null };
    const mine = shifts.filter((s) => !s.day_off && s.date >= todayIso());
    const theirBox = el("div");

    if (!mine.length) app.append(el("p", { class: "sub", text: t("sa_no_future_shifts") }));
    else {
      const chips = (items, label, onPick, disabled) => {
        const box = el("div", { class: "chips" });
        for (const it of items) {
          const c = el("button", { class: "chip", type: "button", text: label(it), disabled: disabled ? disabled(it) : false });
          c.onclick = () => { box.querySelectorAll(".chip").forEach((x) => x.classList.remove("on")); c.classList.add("on"); onPick(it); };
          box.append(c);
        }
        return box;
      };
      const renderTheirs = () => {
        theirBox.replaceChildren();
        if (!pick.colleague) return;
        const options = [{ id: null }, ...pick.colleague.shifts];
        theirBox.append(el("span", { class: "label", text: t("sa_pick_their") }),
          chips(options, (s) => s.id ? `${dayLabel(s.date)} ${shiftLabel(s)}` : t("sa_just_give"), (s) => { pick.theirs = s.id; }));
        pick.theirs = undefined;
      };
      app.append(
        el("div", { class: "field" }, el("span", { class: "label", text: t("sa_pick_shift") }),
          chips(mine, (s) => `${dayLabel(s.date)} ${shiftLabel(s)}`, (s) => { pick.shift = s.id; })),
        el("div", { class: "field" }, el("span", { class: "label", text: t("sa_pick_colleague") }),
          chips(colleagues, (c) => `${c.name} · ${c.position}` + (c.in_bot ? "" : ` (${t("sa_not_in_bot")})`),
            (c) => { pick.colleague = c; renderTheirs(); }, (c) => !c.in_bot)),
        el("div", { class: "field" }, theirBox),
      );
      setBottom(t("sa_swap_send"), async () => {
        if (!pick.shift || !pick.colleague || pick.theirs === undefined) { haptic("error"); toast(t("app_fix_errors")); return; }
        try {
          await api("/api/swaps", { shift_id: pick.shift, colleague_id: pick.colleague.id, their_shift_id: pick.theirs });
          haptic("success"); toast(t("sa_swap_sent"), true); show(staffSwap);
        } catch (e) { haptic("error"); toast(errText(e)); }
      });
    }

    if (swaps.length) {
      app.append(el("h2", { text: t("sa_my_swaps") }));
      for (const s of swaps) {
        const a = s.mine ? `${dayLabel(s.mine.date)} ${shiftLabel(s.mine)}` : "—";
        const b = s.theirs ? `${dayLabel(s.theirs.date)} ${shiftLabel(s.theirs)}` : "";
        app.append(el("div", { class: "item" },
          el("div", { class: "top" }, el("span", { text: `${s.outgoing ? "→" : "←"} ${s.colleague}` }),
            el("span", { class: "st", text: t("sa_swap_st_" + s.status) })),
          el("div", { class: "sub", text: b ? `${a} ⇄ ${b}` : a })));
      }
    }
  });
}

function staffLeave() {
  loading(t("sa_leave"), () => api("/api/requests"), ({ vacation_left, requests }) => {
    const f = { kind: "vacation", date_from: "", date_to: "", reason: "" };
    const today = todayIso();
    const toField = el("div", { class: "field" }, el("span", { class: "label", text: t("sa_date_to") }),
      el("input", { type: "date", min: today, oninput: (e) => { f.date_to = e.target.value; } }));
    const reasonField = el("div", { class: "field", hidden: true }, el("span", { class: "label", text: t("sa_reason") }),
      el("textarea", { maxlength: 300, oninput: (e) => { f.reason = e.target.value; } }));
    const fromInput = el("input", { type: "date", min: today, oninput: (e) => { f.date_from = e.target.value; } });
    const kinds = el("div", { class: "chips" });
    for (const k of ["vacation", "dayoff", "sick"]) {
      const c = el("button", { class: "chip" + (k === f.kind ? " on" : ""), type: "button",
                               text: t("kind_" + k).replace(/^./, (x) => x.toUpperCase()) });
      c.onclick = () => {
        f.kind = k;
        kinds.querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
        c.classList.add("on");
        toField.hidden = k === "sick";
        reasonField.hidden = k !== "dayoff";
        fromInput.min = k === "sick" ? "" : today;  // больничный может начаться раньше
      };
      kinds.append(c);
    }
    app.append(
      el("div", { class: "who" }, el("div", { class: "meta", text: t("sa_vacation_left") }),
        el("div", { class: "big-num", text: `${vacation_left} ${t("sa_days")}` })),
      el("h2", { text: t("sa_new_request") }),
      el("div", { class: "field" }, kinds),
      el("div", { class: "field" }, el("span", { class: "label", text: t("sa_date_from") }), fromInput),
      toField, reasonField,
    );
    setBottom(t("sa_send"), async () => {
      if (!f.date_from) { haptic("error"); toast(t("err_date")); return; }
      try {
        await api("/api/requests", { kind: f.kind, date_from: f.date_from, date_to: f.date_to || f.date_from, reason: f.reason });
        haptic("success"); toast(t("sa_request_sent"), true); show(staffLeave);
      } catch (e) { haptic("error"); toast(errText(e)); }
    });
    if (requests.length) {
      app.append(el("h2", { text: t("sa_my_requests") }));
      for (const r of requests) {
        const period = r.date_to && r.date_to !== r.date_from
          ? `${dotsDate(r.date_from)} – ${dotsDate(r.date_to)} (${r.days} ${t("sa_days")})` : dotsDate(r.date_from);
        app.append(el("div", { class: "item" },
          el("div", { class: "top" }, el("span", { text: `№${r.id} ${t("kind_" + r.kind)}` }),
            el("span", { class: "st", text: t("st_" + r.status) })),
          el("div", { class: "sub", text: period + (r.reason ? `\n${r.reason}` : "") })));
      }
    }
  });
}

// ---------- адаптация ----------

function progressBlock(a) {
  const pct = Math.round(100 * a.progress.both / Math.max(a.progress.total, 1));
  return el("div", { class: "who" },
    el("div", { class: "name", text: a.role === "mentor" ? a.trainee : a.plan_title[lang] }),
    el("div", { class: "meta", text: `${t("ad_day").replace("{day}", Math.min(a.day, a.total)).replace("{total}", a.total)}`
      + ` · ${t("ad_mentor")}: ${a.mentor || t("ad_no_mentor")}` }),
    el("div", { class: "bar" }, el("div", { style: `width:${pct}%` })),
    el("div", { class: "meta", text: `${t("ad_progress")}: ${a.progress.both}/${a.progress.total}` }),
    a.lagging ? el("div", { class: "meta", style: "color: var(--danger); margin-top: 4px", text: t("ad_lagging") }) : null);
}

function adaptMine() {
  loading(t("ad_tile_mine"), () => api("/api/adaptation"), ({ mine }) => {
    if (!mine) { app.append(el("p", { class: "sub", text: t("sa_err_generic") })); return; }
    show(() => adaptDetail(mine.id));
  });
}

function adaptTrainees() {
  loading(t("ad_tile_trainees"), () => api("/api/adaptation"), ({ trainees }) => {
    if (!trainees.length) app.append(el("p", { class: "sub", text: t("ad_no_trainees") }));
    for (const a of trainees) {
      const node = progressBlock(a);
      node.style.cursor = "pointer";
      node.onclick = () => go(() => adaptDetail(a.id));
      app.append(node);
    }
  });
}

function adaptDetail(id) {
  loading(t("ad_tile_mine"), () => api(`/api/adaptation/${id}`), (a) => renderAdapt(a));
}

function renderAdapt(a) {
  const heading = app.querySelector("h1");
  if (heading) heading.textContent = a.role === "mentor" ? t("ad_tile_trainees") : t("ad_tile_mine");
  const box = el("div");
  app.append(box);
  const draw = (a) => {
    box.replaceChildren(progressBlock(a), el("p", { class: "note", text: t(a.role === "mentor" ? "ad_hint_mentor" : "ad_hint_trainee") }));
    const stages = [...a.stages].sort((x, y) => (y.current - x.current));  // текущий этап — первым
    for (const s of stages) {
      const node = el("div", { class: "stage" + (s.open ? "" : " future") },
        el("h3", {}, s.title[lang], s.current ? el("span", { class: "now", text: t("ad_now") }) : null));
      for (const it of s.items) {
        const done = it.mentor && it.trainee;
        const mark = done ? "✅" : it.mentor ? "☑️" : "○";
        const state = done ? "" : it.mentor ? (a.role === "mentor" ? t("ad_wait_trainee") : "") : t("ad_wait_mentor");
        const row = el("div", { class: "check" },
          el("span", { class: "mark", text: mark }),
          el("span", { class: "what" }, it.text[lang], state ? el("span", { class: "state", text: state }) : null));
        if (a.role === "trainee" && it.mentor && !it.trainee && s.open) {
          row.append(el("button", { class: "confirm", text: t("ad_confirm"), onclick: () => send(it.key, true) }));
        }
        if (a.role === "mentor" && s.open && !it.trainee) {
          row.style.cursor = "pointer";
          row.onclick = () => send(it.key, !it.mentor);
        }
        node.append(row);
      }
      box.append(node);
    }
  };
  const send = async (item, value) => {
    try {
      const updated = await api(`/api/adaptation/${a.id}/check`, { item, value });
      haptic("success");
      a = updated;
      draw(a);
    } catch (e) { haptic("error"); toast(errText(e)); }
  };
  draw(a);
}

function staffSalary() {
  app.append(el("h1", { text: t("sa_salary") }), el("p", { class: "note", text: t("sa_salary_soon") }));
}

function staffNews() {
  loading(t("sa_news"), () => api("/api/announcements"), ({ announcements }) => {
    if (!announcements.length) app.append(el("p", { class: "sub", text: t("sa_no_news") }));
    for (const a of announcements) {
      app.append(el("div", { class: "item" },
        el("div", { class: "sub", text: dotsDate(a.date) }),
        el("div", { style: "white-space: pre-line; margin-top: 6px", text: a.text })));
    }
  });
}

function staffKnowledge() {
  loading(t("sa_kb"), () => api("/api/knowledge"), ({ articles, sections = {} }) => {
    // по разделам, в порядке появления
    const groups = new Map();
    for (const a of articles) {
      const key = a.section || "general";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(a);
    }
    for (const [key, items] of groups) {
      if (sections[key]) app.append(el("h2", { text: sections[key][lang] }));
      app.append(el("div", { class: "list" }, items.map((a) =>
        el("button", { class: "row", onclick: () => go(() => staffArticle(a)) }, `${a.icon} ${a.title[lang]}`))));
    }
  });
}

function staffArticle(a) {
  app.append(el("h1", { text: `${a.icon} ${a.title[lang]}` }), el("div", { class: "rich", text: a.body[lang] }));
  if (a.video) app.append(el("p", {}, el("a", { href: a.video, text: "▶️ Video", onclick: (e) => { e.preventDefault(); openLink(a.video); } })));
  if (a.pdf) {
    setBottom(t("sa_kb_pdf"), async () => {
      try {
        await api(`/api/knowledge/${encodeURIComponent(a.id)}/send`, {});
        haptic("success"); toast(t("sa_kb_pdf_sent"), true);
      } catch (e) { haptic("error"); toast(errText(e)); }
    });
  }
}

function staffWrite() {
  const f = { to: "hr", anonymous: false, text: "" };
  const toChips = el("div", { class: "chips" });
  for (const [k, key] of [["hr", "sa_to_hr"], ["manager", "sa_to_manager"]]) {
    const c = el("button", { class: "chip" + (k === f.to ? " on" : ""), type: "button", text: t(key) });
    c.onclick = () => { f.to = k; toChips.querySelectorAll(".chip").forEach((x) => x.classList.remove("on")); c.classList.add("on"); };
    toChips.append(c);
  }
  app.append(
    el("h1", { text: t("sa_write") }),
    el("div", { class: "field" }, el("span", { class: "label", text: t("sa_write_to") }), toChips),
    el("div", { class: "field" }, el("span", { class: "label", text: t("sa_message") }),
      el("textarea", { maxlength: 2000, style: "min-height: 140px", oninput: (e) => { f.text = e.target.value; } })),
    el("div", { class: "field" }, el("label", { class: "consent" },
      el("input", { type: "checkbox", onchange: (e) => { f.anonymous = e.target.checked; } }),
      el("span", { text: t("sa_anonymous") }))),
  );
  setBottom(t("sa_send"), async () => {
    if (f.text.trim().length < 3) { haptic("error"); toast(t("err_reason")); return; }
    try {
      await api("/api/message", f);
      haptic("success"); toast(t("sa_message_sent"), true); back();
    } catch (e) { haptic("error"); toast(errText(e)); }
  });
}

async function startStaff() {
  app.replaceChildren(el("div", { class: "loading", text: "…" }));
  await resolveApi();
  if (!API) { app.replaceChildren(el("p", { class: "note", text: t("sa_auth") })); return; }
  try {
    ME = await api("/api/me");
    if (D.texts[ME.lang]) lang = ME.lang;
    TABS = STAFF_TABS;
    show(staffHome);
  } catch (e) {
    app.replaceChildren(el("p", { class: "note", text: errText(e) }));
  }
}

if (STAFF) startStaff(); else { show(home); loadLiveVacancies(); }
</script>
